name: promote

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  merge_group:

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.ref_name != 'main' && github.ref_name != 'next' && !startsWith(github.ref_name, 'maint/')}}
  OWNER: ${{ github.repository_owner }}
  FILE: base-image
  BUILDKIT_PROGRESS: plain
  BUILDX_NO_DEFAULT_LOAD: 1
  BASE_IMAGE_VERSION: ${{ github.ref_name }}-${{ github.sha }}
  APT_HTTP_PROXY: http://host.docker.internal:8000

jobs:
  build:
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      cache: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'next' || startsWith(github.ref_name, 'maint/')) }}

  release:
    needs:
      - build
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
      issues: write
      id-token: write
      # attest the released images
      attestations: write
      artifact-metadata: write

    steps:
      - run: df -h

      # full checkout for semantic-release, which pushes with its own token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 0
          filter: blob:none

      - uses: $/.github/actions/docker

      # allow build cross arch images
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: containerbase/internal-tools/setup@2082203142ae62859ac4a86919258077c6460403 # v5.3.12
        with:
          checkout: false
          apt-proxy: true

      - name: init
        run: |
          echo "OWNER=${OWNER,,}" >> "${GITHUB_ENV}"

      - name: Docker registry login
        if: env.DRY_RUN != 'true'
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${REPOSITORY_OWNER}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: semantic-release
        id: release
        if: github.event_name == 'push'
        run: pnpm semantic-release --dry-run "${DRY_RUN}" --ci "${CI_MODE}"
        env:
          CI_MODE: ${{ env.DRY_RUN != 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # a failed attestation shows as an error but doesn't fail the release
      - name: Attest the slim image
        if: steps.release.outputs.slim-digest
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.OWNER }}/${{ env.FILE }}
          subject-digest: ${{ steps.release.outputs.slim-digest }}
          push-to-registry: true

      - name: Attest the full image
        if: steps.release.outputs.full-digest
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.OWNER }}/${{ env.FILE }}
          subject-digest: ${{ steps.release.outputs.full-digest }}
          push-to-registry: true

      - run: df -h
