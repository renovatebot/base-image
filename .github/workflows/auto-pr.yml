name: auto-pr

on:
  # assigns reviewers to pull requests from forks too, it never checks out their code
  pull_request_target: # zizmor: ignore[dangerous-triggers] # jactionlint ignore=dangerous-triggers
    types:
      - opened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.action == 'opened' && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: hkusu/review-assign-action@5bee595fdb9765d4a0bd35724b6302fa15569158 # v1.4.0
        with:
          reviewers: ${{ vars.REVIEWERS }}
          max-num-of-reviewers: 2
