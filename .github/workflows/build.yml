name: build

on:
  workflow_call:
    inputs:
      cache:
        type: boolean

env:
  OWNER: ${{ github.repository_owner }}
  FILE: base-image
  BUILDKIT_PROGRESS: plain
  BUILDX_NO_DEFAULT_LOAD: 1
  BASE_IMAGE_VERSION: ${{ github.ref_name }}-${{ github.sha }}
  APT_HTTP_PROXY: http://host.docker.internal:8000

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: containerbase/internal-tools/setup@2082203142ae62859ac4a86919258077c6460403 # v5.3.12
        with:
          save-cache: true

  lint:
    runs-on: ubuntu-26.04
    needs:
      - setup
    timeout-minutes: 10
    env:
      # node and pnpm come from the setup action, so `mise exec` must not
      # install them again
      MISE_EXEC_AUTO_INSTALL: 'false'

    steps:
      - uses: containerbase/internal-tools/setup@2082203142ae62859ac4a86919258077c6460403 # v5.3.12

      - name: lint
        run: |
          pnpm prettier
          pnpm check:containerbase

      - name: Install the workflow linters
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: jactionlint shellcheck zizmor

      - name: Check workflow files
        run: mise exec -- jactionlint --color

      - name: Run zizmor
        run: mise exec -- zizmor --format github .github/
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ${{ matrix.arch.os }}
    name: build (${{ matrix.arch.name }})
    needs:
      - setup
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: x86_64
            os: ubuntu-22.04
            tag: amd64
          - name: aarch64
            os: ubuntu-22.04-arm
            tag: arm64

    permissions:
      contents: read
      packages: write

    steps:
      - run: df -h

      - uses: containerbase/internal-tools/setup@2082203142ae62859ac4a86919258077c6460403 # v5.3.12
        with:
          apt-proxy: true

      - uses: $/.github/actions/docker

      # allow build cross arch images
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: compute channel
        if: inputs.cache
        run: |
          if [[ "${REF_NAME}" == "next" ]]; then
            echo "CHANNEL=${REF_NAME}" >> "$GITHUB_ENV"
          elif [[ "${REF_NAME}" == maint/* ]]; then
            echo "CHANNEL=${REF_NAME:6}" >> "$GITHUB_ENV"
          fi
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: build image
        run: docker buildx bake

      - name: Docker registry login
        if: inputs.cache
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: cache images
        if: inputs.cache
        run: docker buildx bake build-cache
        env:
          ARCH: ${{ matrix.arch.tag }}

      - run: df -h

  success:
    needs:
      - setup
      - lint
      - build
    runs-on: ubuntu-26.04
    timeout-minutes: 1

    if: always()

    steps:
      - name: Fail for failed or cancelled setup
        if: |
          needs.setup.result == 'failure' ||
          needs.setup.result == 'cancelled'
        run: exit 1

      - name: Fail for failed or cancelled lint
        if: |
          needs.lint.result == 'failure' ||
          needs.lint.result == 'cancelled'
        run: exit 1

      - name: Fail for failed or cancelled build
        if: |
          needs.build.result == 'failure' ||
          needs.build.result == 'skipped'
        run: exit 1
